<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foxbus Hexagonal Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:   #f5f5f5;
    --color-ink:     #2d3142;
    --color-muted:   #4f5d75;
    --color-accent:  #bf4520;
    --font-sans:     'Geist', system-ui, sans-serif;
    --font-serif:    'Instrument Serif', serif;
    --font-mono:     'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1280px; width: 100%; }
  .diagram-container { width: 100%; overflow-x: auto; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--color-ink);
    margin-bottom: 1.5rem;
  }
  svg { width: 100%; min-width: 1280px; display: block; }
  @media print {
    .diagram-container { overflow-x: visible; }
    svg { min-width: 0; }
  }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Architecture · Hexagonal</p>
  <h1>Foxbus: ports and adapters, current state</h1>
  <div class="diagram-container">
    <svg viewBox="0 0 1280 650" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="foxbus-arch-title foxbus-arch-desc">
      <title id="foxbus-arch-title">Foxbus hexagonal architecture</title>
      <desc id="foxbus-arch-desc">Schedulers trigger the application core, which reaches providers through the Provider port and sinks through the sink ports; Carousel and TfL implement Provider, Screens implements the sink ports.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="arrow-muted-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8a94a6"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== ZONES (background, painted first) ===== -->
      <rect x="600" y="158" width="240" height="352" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="612" y="162" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="171" fill="#5a6580" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">PORTS</text>

      <rect x="920" y="158" width="240" height="352" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="932" y="162" width="130" height="12" rx="2" fill="#f5f5f5"/>
      <text x="997" y="171" fill="#5a6580" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.14em">DRIVEN ADAPTERS</text>

      <!-- ===== ARROWS (drawn before boxes) ===== -->

      <!-- 1: Schedulers -> Application Services (straight, shared y) -->
      <line x1="260" y1="334" x2="300" y2="334" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="264" y="314" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="280" y="323" fill="#5a6580" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">POLL</text>

      <!-- 2: Application Services -> Provider port (destination above source) -->
      <path d="M520,320 H692 Q700,320 700,312 V254" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="566" y="300" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="586" y="309" fill="#5a6580" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">FETCH</text>

      <!-- 3: Application Services -> Sink Ports (destination below source) -->
      <path d="M520,348 H692 Q700,348 700,356 V430" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="562" y="356" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="586" y="365" fill="#5a6580" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text>

      <!-- 4: Provider port -> CarouselProvider (straight, shared y, dashed = implements) -->
      <line x1="820" y1="222" x2="940" y2="222" stroke="#8a94a6" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted-dash)"/>
      <rect x="848" y="202" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="880" y="211" fill="#5a6580" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">IMPLEMENTS</text>

      <!-- 5: Provider port -> TflProvider (elbow, dashed = implements) -->
      <path d="M820,238 H872 Q880,238 880,246 V334 Q880,342 888,342 H940" fill="none" stroke="#8a94a6" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted-dash)"/>
      <rect x="890" y="284" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="922" y="293" fill="#5a6580" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">IMPLEMENTS</text>

      <!-- 6: Sink Ports -> ScreensSink (straight, shared y, dashed = implements) -->
      <line x1="820" y1="462" x2="940" y2="462" stroke="#8a94a6" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted-dash)"/>
      <rect x="848" y="442" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="880" y="451" fill="#5a6580" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.06em">IMPLEMENTS</text>

      <!-- ===== NODES (painted after arrows) ===== -->

      <!-- Schedulers (Pollers) — input treatment -->
      <rect x="40" y="302" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="302" width="220" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <rect x="48" y="308" width="38" height="12" rx="2" fill="transparent" stroke="#5a6580" stroke-width="0.8"/>
      <text x="67" y="317" fill="#5a6580" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">TIMER</text>
      <text x="150" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Schedulers (Pollers)</text>
      <text x="150" y="352" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">bus · disruption · closure</text>

      <!-- Application Services — backend treatment -->
      <rect x="300" y="302" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="300" y="302" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="308" y="308" width="34" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8"/>
      <text x="325" y="317" fill="rgba(45,49,66,0.8)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="410" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Application Services</text>
      <text x="410" y="352" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">Arrivals·Disruptions·Closures</text>

      <!-- Provider port — focal treatment -->
      <rect x="620" y="190" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="190" width="200" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="628" y="196" width="34" height="12" rx="2" fill="transparent" stroke="#bf4520" stroke-width="0.8"/>
      <text x="645" y="205" fill="#bf4520" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">PORT</text>
      <text x="720" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Provider Port</text>
      <text x="720" y="240" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">fetch_arrivals/2 · caps</text>

      <!-- Sink Ports — optional/interface treatment (dashed) -->
      <rect x="620" y="430" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="430" width="200" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="628" y="436" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="645" y="445" fill="rgba(45,49,66,0.8)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">PORT</text>
      <text x="720" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">Sink Ports</text>
      <text x="720" y="480" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">Arrivals·Disruption·Closure</text>

      <!-- CarouselProvider — backend treatment -->
      <rect x="940" y="190" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="940" y="190" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="948" y="196" width="34" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8"/>
      <text x="965" y="205" fill="rgba(45,49,66,0.8)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
      <text x="1040" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">CarouselProvider</text>
      <text x="1040" y="240" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">scrape+disruptions+closure</text>

      <!-- TflProvider — backend treatment -->
      <rect x="940" y="310" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="940" y="310" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="948" y="316" width="34" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8"/>
      <text x="965" y="325" fill="rgba(45,49,66,0.8)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
      <text x="1040" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">TflProvider</text>
      <text x="1040" y="360" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">Timetable + Line Status</text>

      <!-- ScreensSink — backend treatment -->
      <rect x="940" y="430" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="940" y="430" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="948" y="436" width="34" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-width="0.8"/>
      <text x="965" y="445" fill="rgba(45,49,66,0.8)" font-size="7" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">NEST</text>
      <text x="1040" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--font-sans)" text-anchor="middle">ScreensSink</text>
      <text x="1040" y="480" fill="#4f5d75" font-size="9" font-family="var(--font-mono)" text-anchor="middle">renders to Nest display</text>

      <!-- ===== LEGEND ===== -->
      <line x1="40" y1="552" x2="1240" y2="552" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="572" fill="#4f5d75" font-size="8" font-family="var(--font-mono)" letter-spacing="0.14em">LEGEND</text>

      <rect x="150" y="564" width="14" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="172" y="575" fill="#2d3142" font-size="9" font-family="var(--font-sans)">Adapter / core service</text>

      <rect x="380" y="564" width="14" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="402" y="575" fill="#2d3142" font-size="9" font-family="var(--font-sans)">Port driving the flow</text>

      <rect x="610" y="564" width="14" height="14" rx="3" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="632" y="575" fill="#2d3142" font-size="9" font-family="var(--font-sans)">Port / interface (no own process)</text>

      <line x1="900" y1="571" x2="930" y2="571" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="938" y="575" fill="#2d3142" font-size="9" font-family="var(--font-sans)">calls</text>

      <line x1="1000" y1="571" x2="1030" y2="571" stroke="#8a94a6" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted-dash)"/>
      <text x="1038" y="575" fill="#2d3142" font-size="9" font-family="var(--font-sans)">implements</text>

    </svg>
  </div>
</div>
</body>
</html>
